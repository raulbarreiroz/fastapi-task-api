version: '3.8'

services:
  api:
    build: .
    container_name: fastapi-task-api-dev
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - APP_ENV=development
      - PORT=${PORT:-8000}
      - WORKERS=${WORKERS:-2}   # Fewer workers for dev to save resources
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
    # Mount local code for hot-reloading
    volumes:
      - ./app:/app/app
    # Override the default CMD to use Uvicorn with --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --reload